<Directory /var/www/html>
    Options -Indexes
    <FilesMatch "^(config|settings)\.php$">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /var/www/html/uploads>
    php_admin_flag engine off
    <FilesMatch "\.(php[0-9]*|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>
