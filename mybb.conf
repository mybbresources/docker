<Directory /var/www/html>
    AllowOverride None
    Options -Indexes -ExecCGI

    <FilesMatch "^(config|settings)\.php$">
        Require all denied
    </FilesMatch>
</Directory>

<DirectoryMatch "^/var/www/html/(cache|uploads)(/|$)">
    Options -FollowSymLinks -SymLinksIfOwnerMatch
    php_admin_flag engine off

    <FilesMatch "(?i)(^\.|\.(php[0-9]*|phtml|phar)(\.|$))">
        Require all denied
    </FilesMatch>
</DirectoryMatch>

<LocationMatch "^/install(?:/|$)">
    <If "-f '/var/www/html/install/lock'">
        Require all denied
    </If>
</LocationMatch>
