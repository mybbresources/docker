name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+-[0-9]+"]
  workflow_dispatch:
    inputs:
      alias_version:
        description: Refresh this MyBB version alias from published revisions
        type: string
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: inputs.alias_version == '' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    concurrency:
      group: publish-image-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      version: ${{ steps.release.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/mybbresources/docker

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate release tag
        id: release
        if: github.ref_type == 'tag'
        run: |
          version="$(sed -n 's/^ARG MYBB_VERSION=//p' Dockerfile)"
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[1-9][0-9]*$ || "${GITHUB_REF_NAME%-*}" != "$version" ]]; then
            echo "Release tag must be ${version}-<positive image revision>."
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build and validate image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" .
          docker run --rm "${IMAGE}:sha-${GITHUB_SHA}" apache2ctl configtest

      - name: Publish to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            docker tag "${IMAGE}:sha-${GITHUB_SHA}" "${IMAGE}:${GITHUB_REF_NAME}"
            docker push "${IMAGE}:${GITHUB_REF_NAME}"
          else
            docker push "${IMAGE}:sha-${GITHUB_SHA}"
            docker tag "${IMAGE}:sha-${GITHUB_SHA}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          fi

  update-version-alias:
    needs: publish
    if: >-
      ${{ !cancelled() &&
          ((needs.publish.result == 'success' && needs.publish.outputs.version != '') ||
           (github.ref == 'refs/heads/main' && inputs.alias_version != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: mybb-version-alias-${{ inputs.alias_version || needs.publish.outputs.version }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE: ghcr.io/mybbresources/docker
      VERSION: ${{ inputs.alias_version || needs.publish.outputs.version }}
    steps:
      - name: Alias the highest published image revision
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a MyBB version such as 1.8.41."
            exit 1
          fi
          tags="$(gh api --paginate orgs/mybbresources/packages/container/docker/versions \
            --jq '.[].metadata.container.tags[]')"
          revision="$(printf '%s\n' "$tags" | awk -v version="$VERSION" '
            index($0, version "-") == 1 {
              revision = substr($0, length(version) + 2)
              if (revision ~ /^[1-9][0-9]*$/) print revision
            }
          ' | sort -n | tail -n 1)"
          if [[ -z "$revision" ]]; then
            echo "No published image revisions found for MyBB $VERSION."
            exit 1
          fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          source="$IMAGE:$VERSION-$revision"
          target="$IMAGE:$VERSION"
          docker buildx imagetools create --prefer-index=false --tag "$target" "$source"
          source_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$source")"
          target_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$target")"
          test -n "$source_digest"
          test "$source_digest" = "$target_digest"
          printf '%s points to %s (%s)\n' "$target" "$source" "$target_digest"
